<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#faf8ef"><link rel="manifest" href="manifest.webmanifest"><title>Puzzle 2048</title><style>*{box-sizing:border-box}body{margin:0;background:#faf8ef;color:#776e65;font-family:Arial,sans-serif}.app{width:min(94vw,480px);margin:auto;padding:22px 0}h1{font-size:54px;margin:0}.top{display:flex;justify-content:space-between;align-items:center}.scores{display:flex;gap:7px}.score{background:#bbada0;color:#fff;border-radius:6px;padding:7px 12px;text-align:center}.score small{display:block;font-size:10px}.score b{font-size:18px}p{font-size:15px}button{border:0;background:#8f7a66;color:#fff;font-weight:bold;border-radius:7px;padding:12px 17px;font-size:15px}.new{float:right}.clear{clear:both}.board{margin-top:18px;background:#bbada0;border-radius:10px;padding:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;touch-action:none}.tile{aspect-ratio:1;background:#cdc1b4;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:clamp(24px,8vw,42px);font-weight:900}.t2{background:#eee4da}.t4{background:#ede0c8}.t8{background:#f2b179;color:#fff}.t16{background:#f59563;color:#fff}.t32{background:#f67c5f;color:#fff}.t64{background:#f65e3b;color:#fff}.t128{background:#edcf72;color:#fff}.t256{background:#edcc61;color:#fff}.t512{background:#edc850;color:#fff}.t1024,.t2048{background:#edc53f;color:#fff}.msg{display:none;margin-top:14px;background:#ede0c8;border-radius:8px;padding:15px;text-align:center;font-weight:bold}.help{text-align:center;margin-top:16px}</style></head><body><div class="app"><div class="top"><h1>2048</h1><div class="scores"><div class="score"><small>SCORE</small><b id="score">0</b></div><div class="score"><small>BEST</small><b id="best">0</b></div></div></div><p><b>Join the numbers and reach 2048!</b></p><button class="new" onclick="newGame()">New Game</button><div class="clear"></div><div id="board" class="board"></div><div id="msg" class="msg">Game Over!<br><button onclick="newGame()">Play Again</button></div><div class="help">Swipe up, down, left or right to play.</div></div><script>
let b,s=0,best=Number(localStorage.best2048||0),el=document.getElementById("board");document.getElementById("best").textContent=best;
function newGame(){b=Array.from({length:4},()=>Array(4).fill(0));s=0;document.getElementById("msg").style.display="none";add();add();draw()}
function add(){let e=[];for(let r=0;r<4;r++)for(let c=0;c<4;c++)if(!b[r][c])e.push([r,c]);if(e.length){let x=e[Math.floor(Math.random()*e.length)];b[x[0]][x[1]]=Math.random()<.9?2:4}}
function line(a){a=a.filter(Boolean);let o=[],g=0;for(let i=0;i<a.length;i++){if(i+1<a.length&&a[i]==a[i+1]){o.push(a[i]*2);g+=a[i]*2;i++}else o.push(a[i])}while(o.length<4)o.push(0);return[o,g]}
function move(d){let old=JSON.stringify(b),n=Array.from({length:4},()=>Array(4).fill(0));for(let i=0;i<4;i++){let a=[];for(let j=0;j<4;j++){let r=i,c=j;if(d=="right")c=3-j;if(d=="up"){r=j;c=i}if(d=="down"){r=3-j;c=i}a.push(b[r][c])}let z=line(a)[0];for(let j=0;j<4;j++){let r=i,c=j;if(d=="right")c=3-j;if(d=="up"){r=j;c=i}if(d=="down"){r=3-j;c=i}n[r][c]=z[j]}}b=n;if(JSON.stringify(b)!=old){let g=0;for(let r=0;r<4;r++)for(let c=0;c<4;c++)if(b[r][c]&&!b[r][c+1]===false){};add();draw();if(!can())document.getElementById("msg").style.display="block"}}
function can(){for(let r=0;r<4;r++)for(let c=0;c<4;c++){if(!b[r][c])return true;if(c<3&&b[r][c]==b[r][c+1])return true;if(r<3&&b[r][c]==b[r+1][c])return true}return false}
function draw(){el.innerHTML="";for(let r=0;r<4;r++)for(let c=0;c<4;c++){let v=b[r][c],d=document.createElement("div");d.className="tile "+(v?"t"+v:"");d.textContent=v||"";el.appendChild(d)}document.getElementById("score").textContent=s;document.getElementById("best").textContent=best}
let x=0,y=0;el.ontouchstart=e=>{x=e.touches[0].clientX;y=e.touches[0].clientY};el.ontouchend=e=>{let X=e.changedTouches[0].clientX-x,Y=e.changedTouches[0].clientY-y;if(Math.max(Math.abs(X),Math.abs(Y))<25)return;move(Math.abs(X)>Math.abs(Y)?(X>0?"right":"left"):(Y>0?"down":"up"))};document.onkeydown=e=>{let m={ArrowLeft:"left",ArrowRight:"right",ArrowUp:"up",ArrowDown:"down"}[e.key];if(m)move(m)};newGame();
</script><script>if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js");</script></body></html>
