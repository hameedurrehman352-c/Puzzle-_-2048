<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#faf8ef">
  <meta name="description" content="A fun and challenging 2048 puzzle game">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>2048</title>

  <style>
    * {
      box-sizing: border-box;
      touch-action: manipulation;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #faf8ef;
      color: #776e65;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
    }

    .game {
      width: 100%;
      max-width: 650px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 80px;
      margin: 0;
      line-height: 1;
    }

    .scores {
      display: flex;
      gap: 8px;
    }

    .score-box {
      background: #bbada0;
      color: white;
      padding: 12px 20px;
      border-radius: 6px;
      text-align: center;
      font-weight: bold;
    }

    .score-title {
      font-size: 14px;
    }

    .score {
      font-size: 24px;
    }

    .subtitle {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    button {
      border: 0;
      background: #8f7a66;
      color: white;
      padding: 15px 25px;
      border-radius: 6px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 25px;
    }

    .board {
      background: #bbada0;
      padding: 10px;
      border-radius: 12px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      width: 100%;
      aspect-ratio: 1;
    }

    .cell {
      background: #cdc1b4;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(28px, 8vw, 55px);
      font-weight: bold;
      color: #776e65;
    }

    .tile-2 {
      background: #eee4da;
    }

    .tile-4 {
      background: #ede0c8;
    }

    .tile-8 {
      background: #f2b179;
      color: white;
    }

    .tile-16 {
      background: #f59563;
      color: white;
    }

    .tile-32 {
      background: #f67c5f;
      color: white;
    }

    .tile-64 {
      background: #f65e3b;
      color: white;
    }

    .tile-128 {
      background: #edcf72;
      color: white;
      font-size: clamp(24px, 7vw, 45px);
    }

    .tile-256,
    .tile-512,
    .tile-1024,
    .tile-2048 {
      background: #edc53f;
      color: white;
      font-size: clamp(20px, 6vw, 40px);
    }

    .instructions {
      text-align: center;
      font-size: 20px;
      margin-top: 25px;
    }
  </style>
</head>

<body>

<div class="game">

  <header>
    <h1>2048</h1>

    <div class="scores">
      <div class="score-box">
        <div class="score-title">SCORE</div>
        <div id="score" class="score">0</div>
      </div>

      <div class="score-box">
        <div class="score-title">BEST</div>
        <div id="best" class="score">0</div>
      </div>
    </div>
  </header>

  <div class="subtitle">
    Join the numbers and reach 2048!
  </div>

  <button onclick="newGame()">New Game</button>

  <div id="board" class="board"></div>

  <div class="instructions">
    Swipe up, down, left or right to play.
  </div>

</div>

<script>
  let board = [];
  let score = 0;
  let best = Number(localStorage.getItem("best2048") || 0);

  const boardElement = document.getElementById("board");
  const scoreElement = document.getElementById("score");
  const bestElement = document.getElementById("best");

  bestElement.textContent = best;

  function newGame() {
    board = Array.from({ length: 4 }, () => Array(4).fill(0));
    score = 0;

    addRandomTile();
    addRandomTile();

    updateBoard();
  }

  function addRandomTile() {
    const empty = [];

    for (let r = 0; r < 4; r++) {
      for (let c = 0; c < 4; c++) {
        if (board[r][c] === 0) {
          empty.push([r, c]);
        }
      }
    }

    if (empty.length === 0) return;

    const [r, c] = empty[Math.floor(Math.random() * empty.length)];
    board[r][c] = Math.random() < 0.9 ? 2 : 4;
  }

  function updateBoard() {
    boardElement.innerHTML = "";

    for (let r = 0; r < 4; r++) {
      for (let c = 0; c < 4; c++) {
        const cell = document.createElement("div");
        const value = board[r][c];

        cell.className = "cell";

        if (value > 0) {
          cell.textContent = value;
          cell.classList.add("tile-" + value);
        }

        boardElement.appendChild(cell);
      }
    }

    scoreElement.textContent = score;

    if (score > best) {
      best = score;
      localStorage.setItem("best2048", best);
      bestElement.textContent = best;
    }
  }

  function move(direction) {
    let oldBoard = JSON.stringify(board);

    if (direction === "left") {
      for (let r = 0; r < 4; r++) {
        board[r] = slide(board[r]);
      }
    }

    if (direction === "right") {
      for (let r = 0; r < 4; r++) {
        board[r] = slide(board[r].slice().reverse()).reverse();
      }
    }

    if (direction === "up") {
      for (let c = 0; c < 4; c++) {
        let column = [];

        for (let r = 0; r < 4; r++) {
          column.push(board[r][c]);
        }

        column = slide(column);

        for (let r = 0; r < 4; r++) {
          board[r][c] = column[r];
        }
      }
    }

    if (direction === "down") {
      for (let c = 0; c < 4; c++) {
        let column = [];

        for (let r = 0; r < 4; r++) {
          column.push(board[r][c]);
        }

        column = slide(column.reverse()).reverse();

        for (let r = 0; r < 4; r++) {
          board[r][c] = column[r];
        }
      }
    }

    if (JSON.stringify(board) !== oldBoard) {
      addRandomTile();
      updateBoard();
    }
  }

  function slide(line) {
    line = line.filter(value => value !== 0);

    for (let i = 0; i < line.length - 1; i++) {
      if (line[i] === line[i + 1]) {
        line[i] *= 2;
        score += line[i];
        line.splice(i + 1, 1);
      }
    }

    while (line.length < 4) {
      line.push(0);
    }

    return line;
  }

  document.addEventListener("keydown", function(event) {
    if (event.key === "ArrowLeft") move("left");
    if (event.key === "ArrowRight") move("right");
    if (event.key === "ArrowUp") move("up");
    if (event.key === "ArrowDown") move("down");
  });

  let startX = 0;
  let startY = 0;

  document.addEventListener("touchstart", function(event) {
    startX = event.touches[0].clientX;
    startY = event.touches[0].clientY;
  }, { passive: true });

  document.addEventListener("touchend", function(event) {
    const endX = event.changedTouches[0].clientX;
    const endY = event.changedTouches[0].clientY;

    const dx = endX - startX;
    const dy = endY - startY;

    if (Math.max(Math.abs(dx), Math.abs(dy)) < 30) return;

    if (Math.abs(dx) > Math.abs(dy)) {
      move(dx > 0 ? "right" : "left");
    } else {
      move(dy > 0 ? "down" : "up");
    }
  }, { passive: true });

  newGame();

  // Register the Service Worker
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js")
        .then(() => console.log("Service Worker registered"))
        .catch(error => console.log("Service Worker error:", error));
    });
  }
</script>

</body>
      </html>
